name: Check and deploy to GitHub Pages

# Every push runs the checks and builds the static site; only the default branch deploys.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:pages
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # With "Deploy from a branch", GitHub publishes the README through Jekyll instead of this build.
      - name: Check that Pages publishes from GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo not-enabled)
          echo "GitHub Pages build type: $build_type"
          if [ "$build_type" != "workflow" ]; then
            echo "::error title=GitHub Pages source::Set Settings > Pages > Build and deployment > Source to 'GitHub Actions' (currently: $build_type), then push or re-run."
            exit 1
          fi
      - id: deployment
        uses: actions/deploy-pages@v4
